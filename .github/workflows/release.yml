name: Release

# Tag-driven. The tag is the trigger and the version marker; electron-builder
# reads the version from package.json, so the two must agree (tag v0.1.0 ->
# "version": "0.1.0"). workflow_dispatch is here to re-run against an existing
# tag after a failure, without having to move the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The default GITHUB_TOKEN needs write access to create the release and upload
# assets to it.
permissions:
  contents: write

jobs:
  build:
    # macOS installers can only be built on macOS, so the full set of files the
    # download page promises needs both runners. fail-fast off: one platform
    # failing shouldn't throw away a good build from the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --publish never: the builders must not touch the release. Two jobs
      # running at once both find no draft for the tag and both create one, so
      # letting either publish produces two half-filled releases. Building to
      # disk and releasing once, below, is what makes that impossible.
      - run: npm run ${{ matrix.script }} -- --publish never

      # Installers and their update metadata only - dist/ also holds the
      # unpacked app directories, which are large and not worth shipping.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only a tag can name a release. On a workflow_dispatch from a branch the
    # builds still run and their artifacts are downloadable from the run page.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # gh needs no checkout when it is told which repo to act on.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Needs the Claude Code CLI already installed.

          | download | for |
          |---|---|
          | `-win-x64-setup.exe` | Windows, installed |
          | `-win-x64-portable.exe` | Windows, no install |
          | `-mac-arm64.dmg` | Apple Silicon (M1 and later) |
          | `-mac-x64.dmg` | Intel Mac |

          On an Apple Silicon Mac take the `arm64` file. The `x64` one installs
          without complaint and then runs under Rosetta, so it is easy to pick
          by accident and slower once you have.

          **These builds carry no developer certificate.** Windows SmartScreen
          warns on the `.exe`: More info -> Run anyway. macOS blocks the first
          launch: open System Settings -> Privacy & Security, scroll to the
          message naming BatonPass, and press Open Anyway. Right-click -> Open
          has not worked since macOS 15.
          EOF
          gh release create "$TAG" \
            --draft \
            --title "${TAG#v}" \
            --notes-file notes.md \
            installers/*
